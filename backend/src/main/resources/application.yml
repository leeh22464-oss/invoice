spring:
  application:
    name: invoice
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoice}
    username: ${SPRING_DATASOURCE_USERNAME:invoice}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 2048MB

server:
  tomcat:
    max-part-count: 110

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    root: ${APP_STORAGE_ROOT:}
  jwt:
    secret: ${APP_JWT_SECRET:}
    ttl: ${APP_JWT_TTL:PT1H}
    secure-cookie: ${APP_COOKIE_SECURE:true}
  credential:
    master-key: ${APP_CREDENTIAL_MASTER_KEY:}
  paddle:
    token-url: ${APP_PADDLE_TOKEN_URL:https://aip.baidubce.com/oauth/2.0/token}
    timeout-ms: 10000
