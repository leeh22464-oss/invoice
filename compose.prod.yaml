services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: invoice
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/invoice
      SPRING_DATASOURCE_USERNAME: invoice
      APP_STORAGE_ROOT: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - invoice-data:/data

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  postgres-data:
  invoice-data:
